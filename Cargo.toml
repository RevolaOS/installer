# SPDX-License-Identifier: GPL-3.0-only

[workspace]
members = ["crates/revola-device", "crates/revola-bundle", "crates/revola-cli", "app/src-tauri"]
resolver = "2"

[workspace.package]
version = "2026.11.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rusb = "0.9.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
