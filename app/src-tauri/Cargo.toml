# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "revola-installer"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "RevolaOS installer for iPod Classic"
publish = false

[lib]
# A distinct library name avoids Windows linker collisions.
name = "revola_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
revola-bundle = { path = "../../crates/revola-bundle" }
revola-device = { path = "../../crates/revola-device" }
# Build revola-device's libusb dependency for each target architecture.
rusb = { version = "0.9.4", features = ["vendored"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "query"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
semver = "1"
tauri-plugin-opener = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

